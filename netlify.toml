[build]
  command = "python3 -m pip install --disable-pip-version-check -r scripts/requirements-search-index.txt && python3 scripts/build_search_index.py"
  publish = "."

[[headers]]
  for = "/sutoor-search/search-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/sutoor-search/search-index.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sutoor-search/*.idx"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/سوتور-البحث/search-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[redirects]]
  from = "/سوتور-البحث/*"
  to = "/sutoor-search/:splat"
  status = 200
  force = true
