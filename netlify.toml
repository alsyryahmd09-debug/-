[build]
  command = "python3 -m pip install --disable-pip-version-check -r scripts/requirements-search-index.txt && python3 scripts/build_search_index.py"
  publish = "."

[build.environment]
  PYTHON_VERSION = "3.13"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sutoor-search/search-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/sutoor-search/search-index.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sutoor-search/*.idx"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/سوتور-البحث/search-worker.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[redirects]]
  from = "/ontology-platform"
  to = "/ontology-platform.html"
  status = 200

[[redirects]]
  from = "/download-center"
  to = "/download-center.html"
  status = 200

[[redirects]]
  from = "/interactive-landmarks"
  to = "/interactive-landmarks.html"
  status = 200

[[redirects]]
  from = "/digital-heritage-documentation"
  to = "/digital-heritage-documentation.html"
  status = 200

[[redirects]]
  from = "/sutoor-bahrain-awal-critical-reading"
  to = "/sutoor-bahrain-awal-critical-reading.html"
  status = 200

[[redirects]]
  from = "/Burial-Mounds-of-Bahrain-Illustrated-Summary"
  to = "/Burial-Mounds-of-Bahrain-Illustrated-Summary.html"
  status = 200

[[redirects]]
  from = "/burial-mounds-of-bahrain-illustrated-summary"
  to = "/Burial-Mounds-of-Bahrain-Illustrated-Summary.html"
  status = 200

[[redirects]]
  from = "/Islamic-Funerary-Inscriptions-of-Bahrain-Illustrated-Summary"
  to = "/Islamic-Funerary-Inscriptions-of-Bahrain-Illustrated-Summary.html"
  status = 200

[[redirects]]
  from = "/بلاد-البحرين-في-فترة-الإمارتين-العيونية-والعقيلية"
  to = "/بلاد-البحرين-في-فترة-الإمارتين-العيونية-والعقيلية.html"
  status = 200

[[redirects]]
  from = "/سوتور-البحث/*"
  to = "/sutoor-search/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/shajarat-alnasab/*"
  to = "/ansab/:splat"
  status = 301
